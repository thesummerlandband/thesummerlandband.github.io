# Publishes changes automatically.
# When Claude or ChatGPT saves a change to its own branch, this merges that
# branch into main, and GitHub Pages updates the live site. Nobody has to open
# or merge a pull request.
name: Publish changes

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge the change into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main

      - name: Rebuild the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "GitHub Pages will rebuild on its own."
